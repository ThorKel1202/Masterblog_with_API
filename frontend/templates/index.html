<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Posts</title>
  <!-- Google Fonts & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>

  <div class="container">
    <h1>📚 Blog Posts</h1>

    <!-- API-Konfiguration -->
    <div class="input-field">
      <input type="text" id="api-base-url" placeholder="Enter API Base URL" value="http://127.0.0.1:5002/api">
      <button onclick="loadPosts()">Load Posts</button>
    </div>

    <!-- Neuen Beitrag erstellen -->
    <div class="input-field">
      <input type="text" id="post-title" placeholder="Enter Post Title">
      <input type="text" id="post-content" placeholder="Enter Post Content">
      <input type="text" id="post-author" placeholder="Enter Author">
      <button onclick="addPost()">Add Post</button>
    </div>
    <div class="input-field">
    <input
        type="text"
        id="search-input"
        placeholder="Search posts..."
    >
    <button onclick="searchPosts()">Search</button>
</div>

<div class="input-field">
    <button onclick="sortPosts('title', 'asc')">
        Title ↑
    </button>

    <button onclick="sortPosts('title', 'desc')">
        Title ↓
    </button>

    <button onclick="sortPosts('author', 'asc')">
        Author ↑
    </button>

    <button onclick="sortPosts('author', 'desc')">
        Author ↓
    </button>

    <button onclick="sortPosts('date', 'asc')">
        Date ↑
    </button>

    <button onclick="sortPosts('date', 'desc')">
        Date ↓
    </button>
</div>
    <!-- Container für dynamische Beiträge -->
    <div id="post-container">
      <!-- Blog posts will be inserted here by JavaScript -->
    </div>
  </div>

  <!-- JavaScript-Anbindung -->
  <script src="static/main.js"></script>
</body>
</html>
